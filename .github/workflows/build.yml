name: Build VCam Test Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3

      - name: Build rootless package
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log
          ls -lah packages/

      - name: Failure diagnostics
        if: failure()
        run: |
          echo "=== error lines ==="
          grep -nE "error:|fatal error" build.log 2>/dev/null | head -40 || echo "(no errors in build.log)"
          echo "=== Theos dir ==="
          ls -la Theos 2>&1 || true
          echo "=== pch files (excl ./theos) ==="
          find . -maxdepth 4 -iname "*pch*" 2>/dev/null | grep -v "^\./theos" | head -20 || true
          MSG=$( { grep -nE "error:|fatal error" build.log 2>/dev/null | head -25; echo "===TAIL==="; tail -n 20 build.log 2>/dev/null; } | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g' | tail -c 2600 )
          printf '::error title=VCam deb build failed::%s\n' "$MSG"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: VCamTestTweak-rootless
          path: packages/*.deb
