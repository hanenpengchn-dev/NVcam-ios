name: Build NVcam iOS Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: List project (diagnostic)
        run: xcodebuild -list -project NVcam.xcodeproj 2>&1 || true
      - name: Build unsigned app
        run: |
          set -eo pipefail
          rm -rf build Payload NVcam-unsigned.ipa
          xcodebuild build \
            -project NVcam.xcodeproj \
            -target NVcam \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log
          APP_PATH="$(find . -name 'NVcam.app' -type d ! -path '*/Payload/*' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "App not found; searching any .app:"
            find . -name '*.app' -type d 2>/dev/null || true
            exit 1
          fi
          mkdir -p Payload && cp -R "$APP_PATH" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload NVcam-unsigned.ipa
          ls -lh NVcam-unsigned.ipa
      - name: Failure diagnostics
        if: failure()
        run: |
          echo "=== tail of build log ==="
          tail -n 40 build.log 2>/dev/null || echo "(no build.log)"
          MSG=$(tail -n 40 build.log 2>/dev/null | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g' | tail -c 1900)
          printf '::error title=NVcam build failed::%s\n' "$MSG"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NVcam-unsigned-ipa
          path: NVcam-unsigned.ipa
          retention-days: 30
